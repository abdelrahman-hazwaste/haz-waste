<script>
const $=s=>document.querySelector(s),app=$('#app');let ME,META,ROLES,CACHE={},view='dashboard';

async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'){return init()}if(!r.ok)throw new Error(j.error||'خطأ');return j}
function loginView(err){app.innerHTML=`<div class="login"><h1>منظومة إدارة المخلفات الخطرة</h1><p>جمع · نقل · تخلص</p>${err?`<div class="err">${esc(err)}</div>`:''}<input id="u" placeholder="اسم الدخول" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button style="width:100%" id="go">دخول</button></div>`;
 const go=async()=>{try{await api('login','POST',{username:$('#u').value,password:$('#p').value});init()}catch(e){loginView(e.message)}};$('#go').onclick=go;$('#p').onkeydown=e=>e.key==='Enter'&&go()}
async function init(){try{const r=await fetch('/api/me');if(!r.ok)return loginView();const j=await r.json();ME=j.user;META=j.meta;ROLES=j.roles;try{SET=await (await fetch('/api/settings')).json()}catch(e){}shell()}catch(e){console.error(e);loginView()}}
const NAV=[['dashboard','لوحة التحكم','manager,employee'],['clients'],['quotes'],['contracts'],['jobs'],['certificates'],['invoices'],['vehicles'],['licenses'],['finance','الحسابات والتجميع','manager,employee'],['transactions'],['templates'],['settings','إعدادات الشركة والترويسة','manager'],['users']];
function shell(){const items=NAV.filter(n=>n[2]?n[2].includes(ME.role):META[n[0]]);if(!items.find(n=>n[0]===view))view=items[0][0];
 app.innerHTML=`<aside><h1>إدارة المخلفات الخطرة<small>جمع · نقل · تخلص</small></h1>${items.map(n=>`<a data-v="${n[0]}" class="${view===n[0]?'on':''}">${n[1]||META[n[0]].title}</a>`).join('')}<a id="pw">تغيير كلمة المرور</a><a id="lo">تسجيل الخروج</a></aside><div class="ov"></div><main><div class="top"><div style="display:flex;align-items:center;gap:10px"><button class="mb" id="mb" aria-label="القائمة">☰</button><h2 id="ttl"></h2></div><div class="who">${esc(ME.name)} <span class="badge">${ROLES[ME.role]}</span></div></div><div id="v"></div></main>`;
 document.body.classList.remove('nav');$('#mb').onclick=()=>document.body.classList.toggle('nav');document.querySelector('.ov').onclick=()=>document.body.classList.remove('nav');document.querySelectorAll('aside a[data-v]').forEach(a=>a.onclick=()=>{view=a.dataset.v;shell()});$('#lo').onclick=async()=>{await api('logout');loginView()};
 $('#pw').onclick=async()=>{const p=prompt('كلمة المرور الجديدة (8 أحرف على الأقل)');if(p){try{await api('password','POST',{password:p});alert('تم التغيير')}catch(e){alert(e.message)}}};render()}
async function render(){const t=(NAV.find(n=>n[0]===view)||[])[1]||META[view]?.title;$('#ttl').textContent=t;({dashboard,finance,settings}[view]||table)(view)}
const bcls=s=>({'تم التخلص':'','ساري':'','نشط':'','مقبول':'','إيراد':'','في النقل':'b-blue','تم الجمع':'b-blue','مُرسل':'b-blue','مجدولة':'b-amb','مسودة':'b-gray','محتمل':'b-amb','منتهي':'b-gray','مرفوض':'b-red','موقوف':'b-red','مصروف':'b-red'}[s]??'b-gray');
async function dashboard(){const s=await api('summary');const net=s.revenue-s.expense,mx=Math.max(1,...s.monthly.map(m=>Math.max(m.rev,m.exp)));const tot=s.jobsByStatus.reduce((a,b)=>a+b.v,0);const st=n=>s.jobsByStatus.find(x=>x.k===n)?.v||0;
$('#v').innerHTML=`<div class="cards"><div class="card"><div class="l">إجمالي الإيرادات</div><div class="v pos">${fmt(s.revenue)} <small>ر.س</small></div></div><div class="card"><div class="l">إجمالي المصروفات</div><div class="v neg">${fmt(s.expense)} <small>ر.س</small></div></div><div class="card"><div class="l">صافي الربح</div><div class="v ${net>=0?'pos':'neg'}">${fmt(net)} <small>ر.س</small></div></div><div class="card"><div class="l">عقود سارية</div><div class="v">${s.activeContracts}</div></div><div class="card"><div class="l">عروض مفتوحة</div><div class="v">${s.openQuotes}</div></div><div class="card"><div class="l">كمية المخلفات (كجم)</div><div class="v">${fmt(s.kgTotal)}</div></div><div class="card"><div class="l">مستحقات غير مسددة (ر.س)</div><div class="v neg">${fmt(s.unpaid.v)}</div></div><div class="card"><div class="l">فواتير متأخرة</div><div class="v ${s.overdue?'neg':''}">${s.overdue}</div></div></div>
<div class="panel" style="margin-bottom:18px"><h3>تنبيهات الانتهاء (خلال 60 يوماً)</h3>${s.alerts.length?`<table><tr><th>النوع</th><th>البند</th><th>تاريخ الانتهاء</th><th></th></tr>${s.alerts.map(a=>`<tr><td>${esc(a.t)}</td><td>${esc(a.n)}</td><td>${esc(a.d)}</td><td><span class="badge ${a.d<new Date().toISOString().slice(0,10)?'b-red':'b-amb'}">${a.d<new Date().toISOString().slice(0,10)?'منتهي':'قريب'}</span></td></tr>`).join('')}</table>`:'لا توجد تنبيهات'}</div>
<div class="grid2"><div class="panel"><h3>الإيرادات والمصروفات الشهرية</h3>${s.monthly.map(m=>`<div class="bar"><span class="n">${m.m}</span><div class="t"><i style="width:${m.rev/mx*50}%"></i><i class="e" style="width:${m.exp/mx*50}%"></i></div><span>${fmt(m.rev)} / ${fmt(m.exp)}</span></div>`).join('')}<div class="legend"><i></i>إيراد<i class="e"></i>مصروف</div></div>
<div class="panel"><h3>الكميات حسب نوع المخلفات (كجم)</h3>${s.wasteByType.map(w=>`<div class="bar"><span class="n">${esc(w.k)}</span><div class="t"><i style="width:${w.v/s.wasteByType[0].v*100}%"></i></div><span>${fmt(w.v)}</span></div>`).join('')}</div></div>
<div class="panel" style="margin-bottom:18px"><h3>مراحل العمليات (${tot})</h3><div class="stages">${['مجدولة','تم الجمع','في النقل','تم التخلص'].map(n=>`<div class="stg"><b>${st(n)}</b>${n}</div>`).join('')}</div></div>
<div class="panel"><h3>أداء المسوّقين</h3><table><tr><th>المسوّق</th><th>عروض</th><th>مقبولة</th><th>قيمة المقبول (ر.س)</th></tr>${s.marketers.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.quotes}</td><td>${m.won}</td><td>${fmt(m.wonValue)}</td></tr>`).join('')}</table></div>`}
async function finance(){const s=await api('summary');const net=s.revenue-s.expense;const cat=k=>s.byCategory.filter(c=>c.kind===k);
$('#v').innerHTML=`<div class="cards"><div class="card"><div class="l">الإيرادات</div><div class="v pos">${fmt(s.revenue)}</div></div><div class="card"><div class="l">المصروفات</div><div class="v neg">${fmt(s.expense)}</div></div><div class="card"><div class="l">الصافي</div><div class="v ${net>=0?'pos':'neg'}">${fmt(net)}</div></div></div>
<div class="grid2"><div class="panel"><h3>تجميع الإيرادات حسب البند</h3><table>${cat('إيراد').map(c=>`<tr><td>${esc(c.k)}</td><td>${fmt(c.v)}</td></tr>`).join('')}<tr><th>الإجمالي</th><th>${fmt(s.revenue)}</th></tr></table></div><div class="panel"><h3>تجميع المصروفات حسب البند</h3><table>${cat('مصروف').map(c=>`<tr><td>${esc(c.k)}</td><td>${fmt(c.v)}</td></tr>`).join('')}<tr><th>الإجمالي</th><th>${fmt(s.expense)}</th></tr></table></div></div>
<div class="panel" style="margin-bottom:18px"><h3>كشف حساب مجمّع للعملاء</h3><table><tr><th>العميل</th><th>عقود سارية</th><th>كمية (كجم)</th><th>الإيرادات (ر.س)</th></tr>${s.byClient.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.contracts}</td><td>${fmt(c.kg)}</td><td>${fmt(c.revenue)}</td></tr>`).join('')}</table></div>
<div class="panel"><h3>الشهري</h3><table><tr><th>الشهر</th><th>إيراد</th><th>مصروف</th><th>الصافي</th></tr>${s.monthly.map(m=>`<tr><td>${m.m}</td><td>${fmt(m.rev)}</td><td>${fmt(m.exp)}</td><td>${fmt(m.rev-m.exp)}</td></tr>`).join('')}</table></div>
<p><button class="sec" onclick="print()">طباعة / حفظ PDF</button></p>`}
