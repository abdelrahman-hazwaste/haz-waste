<script>
const $=s=>document.querySelector(s),app=$('#app');let ME,META,ROLES,CACHE={},view='dashboard';

async function api(p,m='GET',b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&p!=='login'){return init()}if(!r.ok)throw new Error(j.error||'خطأ');return j}
function loginView(err){app.innerHTML=`<div class="login"><h1>منظومة إدارة المخلفات الخطرة</h1><p>جمع · نقل · تخلص</p>${err?`<div class="err">${esc(err)}</div>`:''}<input id="u" placeholder="اسم الدخول" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button style="width:100%" id="go">دخول</button></div>`;

const bcls=s=>({'تم التخلص':'','ساري':'','نشط':'','مقبول':'','إيراد':'','في النقل':'b-blue','تم الجمع':'b-blue','مُرسل':'b-blue','مجدولة':'b-amb','مسودة':'b-gray','محتمل':'b-amb','منتهي':'b-gray','مرفوض':'b-red','موقوف':'b-red','مصروف':'b-red'}[s]??'b-gray');
let FLT=null;const today=()=>new Date().toISOString().slice(0,10);
async function cpExp(list,all){const nm=today().slice(0,7);let n=0;for(const x of list){if(all.some(z=>z.exp_date&&z.exp_date.startsWith(nm)&&z.category===x.category&&(z.name||'')===(x.name||'')&&Number(z.amount)===Number(x.amount))){continue}await api('expenses','POST',{category:x.category,name:x.name,amount:x.amount,exp_date:today(),recurring:x.recurring,notes:x.notes});n++}CACHE={};alert(n?'تم نسخ '+n+' بند للشهر الحالي':'البند موجود مسبقاً في هذا الشهر');table('expenses')}
function copyRecurring(rows){const seen={},list=[];for(const x of rows.filter(r=>r.recurring==='نعم').sort((a,b)=>String(b.exp_date).localeCompare(String(a.exp_date)))){const k=x.category+'|'+(x.name||'');if(!seen[k]){seen[k]=1;list.push(x)}}if(!list.length)return alert('لا توجد بنود متكررة (حدد "يتكرر شهرياً: نعم" عند الإضافة)');if(confirm('نسخ '+list.length+' بند متكرر إلى الشهر الحالي؟'))cpExp(list,rows)}
const GO={rev:['transactions',r=>r.kind==='إيراد','الإيرادات'],exp:['expenses',null,'المصروفات'],qall:['quotes',null,'كل العروض'],qacc:['quotes',r=>r.status==='مقبول','العروض المقبولة'],oq:['quotes',r=>['مسودة','مُرسل'].includes(r.status),'العروض المفتوحة'],cval:['contracts',r=>r.status==='ساري','العقود السارية'],ac:['contracts',r=>r.status==='ساري','العقود السارية'],inv:['invoices',null,'كل الفواتير'],paid:['invoices',r=>Number(r.paid)>0,'فواتير بها مدفوعات'],unpaid:['invoices',r=>r.status!=='مدفوعة','غير مسددة'],overdue:['invoices',r=>r.status!=='مدفوعة'&&r.due_date&&r.due_date<today(),'متأخرة'],jobs:['jobs',null,'العمليات'],net:['mreport'],mrep:['mreport']};
function goTo(k){if(k==='rev'||k==='exp'){DR={kind:k,by:'src',group:null,ym:''};view='drill';CUR_CLIENT=null;return shell()}const g=GO[k];if(!g)return;view=g[0];FLT=g[1]?{f:g[1],t:g[2]}:null;CUR_CLIENT=null;shell()}
async function mreport(ym){const s=await api('summary'),A=s.monthlyAll,nm=today().slice(0,7);ym=/^\d{4}-\d\d$/.test(ym||"")?ym:nm;const cur=A.months.find(x=>x.m===ym)||{m:ym,rev:0,exp:0,ops:0,over:0,net:0};const cats=A.cats.filter(c=>c.m===ym).sort((a,b)=>b.v-a.v);const tr=A.months.reduce((a,x)=>({rev:a.rev+x.rev,exp:a.exp+x.exp}),{rev:0,exp:0});

<div class="panel"><h3>كل الأشهر</h3><table><tr><th>الشهر</th><th>الإيراد</th><th>المصروف</th><th>الصافي</th></tr>${A.months.slice().reverse().map(x=>`<tr class="tap" data-m="${x.m}"><td>${x.m}</td><td>${fmt(x.rev)}</td><td>${fmt(x.exp)}</td><td class="${x.net>=0?'pos':'neg'}">${fmt(x.net)}</td></tr>`).join('')}<tr><th>الإجمالي</th><th>${fmt(tr.rev)}</th><th>${fmt(tr.exp)}</th><th>${fmt(tr.rev-tr.exp)}</th></tr></table></div>
<p class="per">الإيراد = الإيرادات المسجّلة + المحصّل من الفواتير. المصروف = بنود المصروفات + المصروفات المسجّلة + تكاليف العمليات.</p><style>tr.tap{cursor:pointer}.card.tap{cursor:pointer}</style>`;
window.__G=async()=>gMonth(s,ym);$('#gpr').onclick=async e=>gDo('pdf',await gProfit(),e.target);$('#mm').onchange=e=>mreport(e.target.value);$('#v').onclick=e=>{const g=e.target.closest('[data-go]');if(g)return goTo(g.dataset.go);const m=e.target.closest('[data-m]');if(m)return mreport(m.dataset.m);const c=e.target.closest('[data-cat]');if(c){view='expenses';FLT={f:r=>String(r.exp_date||'').startsWith(ym)&&r.category===c.dataset.cat,t:c.dataset.cat+' - '+ym};shell()}}}

/* ===== drill-down: card -> breakdown -> line items ===== */
let DR={kind:'rev',by:'src',group:null,ym:''};
async function drillItems(kind){const[tx,iv,ex,jb,cl]=await Promise.all(['transactions','invoices','expenses','jobs','clients'].map(safe)),cn=id=>(cl.find(c=>c.id==id)||{}).name||'بدون عميل',L=[];
 if(kind==='rev'){for(const t of tx.filter(x=>x.kind==='إيراد'))L.push({d:t.tx_date||'',src:'إيراد مسجّل',cl:t.client_id?cn(t.client_id):'بدون عميل',cat:t.category||'أخرى',t:[t.category,t.note].filter(Boolean).join(' - '),a:Number(t.amount)||0});
  for(const v of iv.filter(x=>Number(x.paid)>0))L.push({d:v.issue_date||'',src:'فواتير محصّلة',cl:cn(v.client_id),cat:'فواتير',t:'فاتورة '+(v.number||''),a:Number(v.paid)||0})}
 else{for(const t of tx.filter(x=>x.kind==='مصروف'))L.push({d:t.tx_date||'',src:t.category||'أخرى',t:[t.category,t.note].filter(Boolean).join(' - '),a:Number(t.amount)||0});
  for(const x of ex)L.push({d:x.exp_date||'',src:x.category||'أخرى',t:x.name||x.category||'',a:Number(x.amount)||0});
  for(const j of jb){const d=j.job_date||(j.created_at||'').slice(0,10),t='عملية '+(j.manifest||'')+' - '+cn(j.client_id);[['cost_disposal','تكاليف التخلص'],['cost_transport','تكاليف النقل'],['cost_other','تكاليف عمليات أخرى']].forEach(([k,n])=>{if(Number(j[k]))L.push({d,src:n,t,a:Number(j[k])})})}}
 return L.sort((a,b)=>String(b.d).localeCompare(String(a.d)))}
async function drill(){const D=DR,all=await drillItems(D.kind),L=all.filter(x=>!D.ym||String(x.d).startsWith(D.ym)),tot=L.reduce((a,x)=>a+x.a,0),isR=D.kind==='rev',key=x=>isR&&D.by==='cl'?x.cl:x.src,G={};L.forEach(x=>{const k=key(x)||'أخرى';(G[k]=G[k]||{k,n:0,v:0}).n++;G[k].v+=x.a});const gs=Object.values(G).sort((a,b)=>b.v-a.v);

 $('#v').innerHTML=`<style>.dr tr{cursor:pointer}.chip{display:inline-block;padding:5px 12px;border-radius:16px;background:var(--g2);color:var(--g);margin-left:6px;cursor:pointer;font-size:14px}.chip.on{background:var(--g);color:#fff}.bar2{height:6px;background:#e3ece7;border-radius:3px;margin-top:3px}.bar2 i{display:block;height:6px;background:var(--g);border-radius:3px}</style>
 <div class="tools"><input id="dm" type="month" value="${D.ym}" style="max-width:160px"> ${gBar()}</div>
 <div class="cards"><div class="card"><div class="l">إجمالي ${ttl}${D.ym?' - '+D.ym:''}</div><div class="v ${isR?'pos':'neg'}">${fmt(tot)} <small>ر.س</small></div><small class="per">${L.length} حركة</small></div></div>

 :`${isR?`<p><span class="chip ${D.by==='src'?'on':''}" data-by="src">حسب المصدر</span><span class="chip ${D.by==='cl'?'on':''}" data-by="cl">حسب العميل</span></p>`:''}<div class="panel"><h3>${isR?'مصدر الإيراد':'أين ذهبت المصروفات'} (اضغط على بند لعرض الحركات)</h3><table class="dr"><tr><th>البند</th><th>عدد</th><th>المبلغ</th><th>%</th></tr>${gs.map(g=>`<tr data-g="${esc(g.k)}"><td>${esc(g.k)}<div class="bar2"><i style="width:${tot?Math.round(g.v/tot*100):0}%"></i></div></td><td>${g.n}</td><td>${fmt(g.v)}</td><td>${tot?Math.round(g.v/tot*100):0}%</td></tr>`).join('')||'<tr><td colspan=4>لا توجد بيانات</td></tr>'}<tr><th>الإجمالي</th><th>${L.length}</th><th>${fmt(tot)}</th><th></th></tr></table></div>`}`;
