 document.body.classList.remove('nav');$('#mb').onclick=()=>document.body.classList.toggle('nav');document.querySelector('.ov').onclick=()=>document.body.classList.remove('nav');document.querySelectorAll('aside a[data-v]').forEach(a=>a.onclick=()=>{view=a.dataset.v;CUR_CLIENT=null;shell()});$('#lo').onclick=async()=>{await api('logout');loginView()};

async function cpExp(list,all){const nm=today().slice(0,7);let n=0;for(const x of list){if(all.some(z=>z.exp_date&&z.exp_date.startsWith(nm)&&z.category===x.category&&(z.name||'')===(x.name||'')&&Number(z.amount)===Number(x.amount))){continue}await api('expenses','POST',{category:x.category,name:x.name,amount:x.amount,exp_date:today(),recurring:x.recurring,notes:x.notes});n++}CACHE={};alert(n?'تم نسخ '+n+' بند للشهر الحالي':'البند موجود مسبقاً في هذا الشهر');table('expenses')}

const GO={rev:['transactions',r=>r.kind==='إيراد','الإيرادات'],exp:['expenses',null,'المصروفات'],qall:['quotes',null,'كل العروض'],qacc:['quotes',r=>r.status==='مقبول','العروض المقبولة'],oq:['quotes',r=>['مسودة','مُرسل'].includes(r.status),'العروض المفتوحة'],cval:['contracts',r=>r.status==='ساري','العقود السارية'],ac:['contracts',r=>r.status==='ساري','العقود السارية'],inv:['invoices',null,'كل الفواتير'],paid:['invoices',r=>Number(r.paid)>0,'فواتير بها مدفوعات'],unpaid:['invoices',r=>r.status!=='مدفوعة','غير مسددة'],overdue:['invoices',r=>r.status!=='مدفوعة'&&r.due_date&&r.due_date<today(),'متأخرة'],jobs:['jobs',null,'العمليات'],net:['mreport'],mrep:['mreport']};
